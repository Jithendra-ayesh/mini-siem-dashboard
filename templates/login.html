<!DOCTYPE html>
<html>
<head>
    <title>Mini SIEM Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="bg-dark">
    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow-lg border-0 rounded-4 p-4 login-card ">
            <div class="text-center mb-4">
                <h1 class="login-logo">
                    🛡
                </h1>
                <h3>Mini SIEM</h3>
                <p id="subtitle" class="text-muted"></p>
            </div>
            <form method="POST" action="/login">

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>
                    </div>
                </div>

                {% if message %}
                <div class="alert alert-danger text-center">
                    {{ message }}
                </div>
                {% endif %}

                <button class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Secure Login
                </button>
            </form>
            </div>
        </div>
            <hr>
            <footer class="footer">
                Mini SIEM Dashboard v1.0
            </footer>
    </div>


    <script>
        const text = "Security Monitoring Dashboard ";
        let i = 0;
        function type(){
            if(i < text.length){
                document.getElementById("subtitle").textContent += text.charAt(i);
                i++;
                setTimeout(type,80);
            }
        }
        window.onload = function (){
            type();
        };
    </script>
</body>
</html>
