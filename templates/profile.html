<!doctype html>
<html>
  <head>
    <title>Employee Profile</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <h2>👤 Employee Profile</h2>

      <hr />

      <table class="table">
        <tr>
          <td>Name</td>

          <td>{{ user.name }}</td>
        </tr>

        <tr>
          <td>Username</td>

          <td>{{ user.username }}</td>
        </tr>

        <tr>
          <td>Department</td>

          <td>{{ user.department }}</td>
        </tr>

        <tr>
          <td>Role</td>

          <td>{{ user.role }}</td>
        </tr>
      </table>

      <a href="/home" class="btn btn-primary"> ← Back </a>
    </div>
  </body>
</html>
