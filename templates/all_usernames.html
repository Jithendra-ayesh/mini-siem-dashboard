<!DOCTYPE html>
<html>
<head>

    <title>All Usernames</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="container mt-4">

<h2>All Targeted Usernames</h2>

<a href="/dashboard"
class="btn btn-secondary mb-3">

Back to Dashboard

</a>

<table class="table table-striped table-bordered">

    <thead>

        <tr>

            <th>#</th>
            <th>Username</th>
            <th>Total Attempts</th>

        </tr>

    </thead>

    <tbody>

    {% for username, count in usernames %}

        <tr>

            <td>{{ loop.index }}</td>
            <td>{{ username }}</td>
            <td>{{ count }}</td>

        </tr>

    {% endfor %}

    </tbody>

</table>

</body>
</html>
